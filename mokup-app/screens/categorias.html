<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../css/mockup.css">
<title>Categorías</title>
</head>
<body>
<div class="screen">
  <div class="status-space"></div>

  <header class="appbar">
    <button class="back-btn" aria-label="Atrás">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1>Categorías</h1>
  </header>

  <main class="content">
    <div class="cat-page-grid">
      <button class="cat-btn"><span class="cat-ico cat-c1"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg></span><span class="cat-label">Programación y Tecnología</span></button>
      <button class="cat-btn"><span class="cat-ico cat-c2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></span><span class="cat-label">Hogar y Limpieza</span></button>
      <button class="cat-btn"><span class="cat-ico cat-c3"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.6 3.6l2.8 2.8L8.4 18.4 4 20l1.6-4.4z"/></svg></span><span class="cat-label">Diseño y Creatividad</span></button>
      <button class="cat-btn"><span class="cat-ico cat-c4"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></span><span class="cat-label">Administración y Finanzas</span></button>
      <button class="cat-btn"><span class="cat-ico cat-c5"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10L12 5 2 10l10 5 10-5zM6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg></span><span class="cat-label">Educación</span></button>
      <button class="cat-btn"><span class="cat-ico cat-c6"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg></span><span class="cat-label">Construcción y Obra</span></button>
      <button class="cat-btn"><span class="cat-ico cat-c1"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.5-1.5 2-3.2 2-5a5 5 0 00-5-5c-1.8 0-3.5.5-5 2-1.5-1.5-3.2-2-5-2a5 5 0 00-5 5c0 1.8.5 3.5 2 5l9 9z"/></svg></span><span class="cat-label">Salud y Enfermería</span></button>
      <button class="cat-btn"><span class="cat-ico cat-c2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 17h.01M18 17h.01M3 17V9l2-5h14l2 5v8M5 17h14v3H5z" transform="translate(0,1)"/></svg></span><span class="cat-label">Transporte y Logística</span></button>
      <button class="cat-btn"><span class="cat-ico cat-c3"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8zM6 1v3M10 1v3M14 1v3"/></svg></span><span class="cat-label">Hostelería y Turismo</span></button>
      <button class="cat-btn"><span class="cat-ico cat-c4"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span><span class="cat-label">Seguridad</span></button>
      <button class="cat-btn"><span class="cat-ico cat-c5"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 20A7 7 0 019.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10z"/><path d="M2 21c0-3 1.9-5.5 5.5-6C9 14.5 12 13 13 13"/></svg></span><span class="cat-label">Agricultura y Ganadería</span></button>
      <button class="cat-btn"><span class="cat-ico cat-c6"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/></svg></span><span class="cat-label">Belleza y Estética</span></button>
      <button class="cat-btn"><span class="cat-ico cat-c1"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg></span><span class="cat-label">Legal y Jurídico</span></button>
      <button class="cat-btn"><span class="cat-ico cat-c2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.6 4.6A2 2 0 1111 8H2M12.6 19.4A2 2 0 1014 16H2M17.7 7.7A2.5 2.5 0 1119.5 12H2"/></svg></span><span class="cat-label">Ingeniería</span></button>
      <button class="cat-btn"><span class="cat-ico cat-c3"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8"/></svg></span><span class="cat-label">Atención al Cliente</span></button>
    </div>
  </main>
</div>
</body>
</html>
